<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>z z-index</title>
    <style>
        .container{
            position: relative;
        }
        .box{
            position: relative;
        }
        .boy{
            position: relative;
            top: -30px;
            left: 30px;
            bottom: 30px;
            z-index: 10;        }
        .ring{
            position: absolute;
            top: 30px;
            z-index: 5;
        }
        .water{
            position: absolute;
            top: 30px;
            z-index: 2;

        }
    </style>

  </head>
  <body>
    <h2>z-index</h2>
    <div class="container">
        <div class="box boy"><img src="swim/boy.svg" alt="" /></div>
    <div class="box ring"><img src="swim/ring.svg" alt="" /></div>
    <div class="box water"><img src="swim/water.svg" alt="" /></div>
    </div>
  </body>
</html>
